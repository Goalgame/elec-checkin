<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบลงเวลา - แผนกอิเล็กทรอนิกส์</title>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        body { font-family: 'Sarabun', system-ui, sans-serif; background: #f0f4f8; margin: 0; padding-top: 40px; display: flex; flex-direction: column; align-items: center; }
        .container { background: white; padding: 30px 25px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 90%; max-width: 340px; text-align: center; }
        .header h2 { color: #1e293b; margin: 0 0 8px 0; }
        .header h2 span { color: #f97316; }
        .icon { font-size: 60px; margin: 15px 0; }
        .dept { font-weight: bold; color: #0f172a; margin-bottom: 20px; }
        .status-box { padding: 25px; border-radius: 12px; background: #f8fafc; }
        .spinner { border: 6px solid #e2e8f0; border-top: 6px solid #f97316; border-radius: 50%; width: 50px; height: 50px; animation: spin 1s linear infinite; margin: 0 auto 15px; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        #status-text { font-size: 17px; font-weight: 600; color: #334155; }
        .error { color: #dc2626 !important; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h2>ระบบเช็คชื่อ <span id="action-text">เข้าเรียน</span></h2>
        </div>
        <div class="icon">🔌</div>
        <div class="dept">แผนกวิชาอิเล็กทรอนิกส์</div>

        <div class="status-box">
            <div class="spinner" id="spinner"></div>
            <div id="status-text">กำลังเริ่มต้นระบบ...</div>
        </div>
    </div>

    <script>
        const GAS_URL = "https://script.google.com/macros/s/XXXXXXXXXXXXXXXX/exec"; // ← ใส่ URL ของคุณ
        const TARGET_LAT = 15.8141829;
        const TARGET_LON = 102.0134325;
        const MAX_DISTANCE = 500;
        const LIFF_ID = "2010231682-1cf9vjea";

        // อ่าน action จาก URL
        const urlParams = new URLSearchParams(window.location.search);
        let actionType = urlParams.get('action') === 'out' ? 'กลับบ้าน' : 'เข้าเรียน';

        document.addEventListener("DOMContentLoaded", () => {
            document.getElementById('action-text').innerText = actionType;
            initializeLiff();
        });

        function initializeLiff() {
            liff.init({ liffId: LIFF_ID }).then(() => {
                if (!liff.isLoggedIn()) {
                    liff.login();
                } else {
                    document.getElementById('status-text').innerText = "กำลังตรวจสอบตำแหน่ง...";
                    getLocation();
                }
            }).catch(err => showError("LIFF Error: " + err.message));
        }

        function getLocation() {
            if (!navigator.geolocation) {
                return showError("อุปกรณ์ไม่รองรับ GPS");
            }

            navigator.geolocation.getCurrentPosition(
                (position) => {
                    const distance = calculateDistance(
                        position.coords.latitude, position.coords.longitude,
                        TARGET_LAT, TARGET_LON
                    );

                    if (distance <= MAX_DISTANCE) {
                        saveToServer(position.coords.latitude, position.coords.longitude);
                    } else {
                        showError(`คุณอยู่นอกพื้นที่ (${distance.toFixed(0)} เมตร)`);
                    }
                },
                () => showError("กรุณาเปิด GPS และอนุญาตการเข้าถึงตำแหน่ง"),
                { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
            );
        }

        function saveToServer(lat, lon) {
            document.getElementById('status-text').innerText = "กำลังบันทึกข้อมูล...";

            liff.getProfile().then(profile => {
                fetch(GAS_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        type: 'saveData',
                        userId: profile.userId,
                        displayName: profile.displayName,
                        action: actionType,
                        lat: lat,
                        lon: lon
                    })
                })
                .then(res => res.json())
                .then(data => {
                    if (data.status === 'success') {
                        document.getElementById('spinner').style.display = 'none';
                        document.getElementById('status-text').innerText = `บันทึกสำเร็จ! (${data.time})`;
                        setTimeout(() => liff.closeWindow(), 1600);
                    } else {
                        showError("บันทึกไม่สำเร็จ: " + data.message);
                    }
                })
                .catch(err => showError("เกิดข้อผิดพลาด: " + err.message));
            });
        }

        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371e3;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
        }

        function showError(msg) {
            document.getElementById('spinner').style.display = 'none';
            const status = document.getElementById('status-text');
            status.innerText = msg;
            status.classList.add('error');
        }
    </script>
</body>
</html>
