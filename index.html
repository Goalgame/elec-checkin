<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>บันทึกเวลา แผนกอิเล็กทรอนิกส์</title>
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        body { font-family: 'Sarabun', sans-serif; background-color: #f0f4f8; display: flex; flex-direction: column; align-items: center; height: 100vh; margin: 0; padding-top: 50px; }
        .header h2 { color: #1e293b; display: inline; } .header h2 span { color: #f97316; }
        .icon { font-size: 60px; margin: 10px 0; }
        .dept-name { color: #0f172a; font-size: 20px; font-weight: bold; margin-bottom: 5px; text-align: center;}
        .loading-box { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); text-align: center; width: 85%; max-width: 320px; }
        .spinner { border: 6px solid #f1f5f9; border-top: 6px solid #f97316; border-radius: 50%; width: 45px; height: 45px; animation: spin 1s linear infinite; margin: 0 auto 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        #status-text { font-size: 16px; color: #334155; font-weight: bold; }
    </style>
</head>
<body>
    <div class="header"><h2>ระบบเช็คชื่อ <span>เข้าเรียน</span></h2></div>
    <div class="icon">🔌</div>
    <div class="dept-name">แผนกวิชาอิเล็กทรอนิกส์</div>
    
    <div class="loading-box">
        <div class="spinner"></div>
        <div id="status-text">กำลังเริ่มต้นระบบ...</div>
    </div>

    <script>
        // 🛑 1. ใส่ URL ของ Apps Script (Backend) ที่ได้จากขั้นตอนแรกตรงนี้
        const GAS_URL = "https://script.google.com/macros/s/AKfycbx4A4rgP9CFzCxVwJrtsELPFl1SoLNu97eAT9mI_LAomPketDoRnLCRlwjpvI42QGJjwg/exec"; 

        // 📍 2. ตั้งค่าพิกัดศูนย์กลาง
        const TARGET_LAT = 15.8141829; 
        const TARGET_LON = 102.0134325; 
        const MAX_DISTANCE = 500; 
        const LIFF_ID = "2010231682-1cf9vjea"; 

        // อ่านค่าว่าเป็นการเข้า หรือ ออก จาก URL (เช่น ?action=out)
        const urlParams = new URLSearchParams(window.location.search);
        const actionType = urlParams.get('action') === 'out' ? 'กลับบ้าน' : 'เข้าเรียน';

        document.addEventListener("DOMContentLoaded", () => {
            if(actionType === 'กลับบ้าน') {
                document.querySelector('.header h2 span').innerText = 'กลับบ้าน';
            }
            initializeLiff();
        });

        function initializeLiff() {
            liff.init({ liffId: LIFF_ID }).then(() => {
                if (!liff.isLoggedIn()) {
                    liff.login();
                } else {
                    document.getElementById('status-text').innerText = "กำลังค้นหา GPS...";
                    getLocation();
                }
            }).catch(err => showError("LIFF Error: " + err.message));
        }

        function getLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        let distance = calculateDistance(position.coords.latitude, position.coords.longitude, TARGET_LAT, TARGET_LON);
                        if (distance <= MAX_DISTANCE) {
                            saveDataAndSendFlex(position.coords.latitude, position.coords.longitude);
                        } else {
                            showError(`คุณอยู่นอกพื้นที่\n(ห่าง ${distance.toFixed(0)} เมตร)`);
                        }
                    },
                    (error) => showError("กรุณาเปิด GPS บนมือถือ"),
                    { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
                );
            } else {
                showError("มือถือไม่รองรับ GPS");
            }
        }

       function saveDataAndSendFlex(lat, lon) {
            document.getElementById('status-text').innerText = "กำลังบันทึกข้อมูล...";
            liff.getProfile().then(profile => {
                
                fetch(GAS_URL, {
                    method: 'POST',
                    body: JSON.stringify({
                        type: 'saveData',
                        userId: profile.userId,
                        displayName: profile.displayName,
                        action: actionType,
                        lat: lat,
                        lon: lon
                    })
                })
                .then(response => response.json())
                .then(data => {
                    if(data.status === 'success') {
                        document.getElementById('status-text').innerText = "บันทึกสำเร็จ!";
                        // สั่งให้หน้าเว็บปิดตัวเอง หลังจากรอ 1.5 วินาที
                        setTimeout(() => {
                            liff.closeWindow(); 
                        }, 1500);
                    } else {
                        showError("บันทึกไม่ได้: " + data.message);
                    }
                })
                .catch(error => showError("ระบบขัดข้อง: " + error));
            });
        }

       
        function calculateDistance(lat1, lon1, lat2, lon2) {
            var R = 6371e3, f1 = lat1 * Math.PI/180, f2 = lat2 * Math.PI/180, df = (lat2-lat1) * Math.PI/180, dl = (lon2-lon1) * Math.PI/180;
            var a = Math.sin(df/2) * Math.sin(df/2) + Math.cos(f1) * Math.cos(f2) * Math.sin(dl/2) * Math.sin(dl/2);
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)); 
        }

        function showError(msg) {
            document.getElementById('status-text').innerText = msg;
            document.getElementById('status-text').style.color = '#dc2626';
            document.querySelector('.spinner').style.display = 'none';
        }
    </script>
</body>
</html>
