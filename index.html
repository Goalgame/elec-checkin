<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>บันทึกเวลา แผนกอิเล็กทรอนิกส์</title>
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        body {
            font-family: 'Sarabun', sans-serif;
            background-color: #f0f4f8;
            background-image: radial-gradient(#cbd5e1 1px, transparent 1px);
            background-size: 20px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            margin: 0;
            padding-top: 50px;
        }
        .header { text-align: center; margin-bottom: 20px; }
        .header h2 { color: #1e293b; display: inline; }
        .header h2 span { color: #f97316; } 
        .icon { font-size: 60px; margin: 10px 0; }
        .dept-name { color: #0f172a; font-size: 20px; font-weight: bold; margin-bottom: 5px; text-align: center;}
        .sub-name { color: #64748b; font-size: 14px; margin-bottom: 25px; text-align: center; }
        
        .loading-box {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
            text-align: center;
            width: 85%;
            max-width: 320px;
        }
        .spinner {
            border: 6px solid #f1f5f9;
            border-top: 6px solid #f97316;
            border-radius: 50%;
            width: 45px;
            height: 45px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        #status-text { font-size: 16px; color: #334155; font-weight: bold; }
        #sub-status { font-size: 12px; color: #94a3b8; margin-top: 8px;}
    </style>
</head>
<body>

    <div class="header">
        <h2 id="page-title">ระบบเช็คชื่อ <span>เข้าเรียน</span></h2>
    </div>
    
    <div class="icon">🔌</div>
    
    <div class="dept-name">แผนกวิชาอิเล็กทรอนิกส์</div>
    <div class="sub-name">Electronics Department</div>

    <div class="loading-box">
        <div class="spinner"></div>
        <div id="status-text">กำลังตรวจสอบพิกัด...</div>
        <div id="sub-status">กรุณารอสักครู่</div>
    </div>

    <script>
        // ==========================================
        // 1. ตั้งค่า URL และพิกัด 
        // ==========================================
        // ** นำ URL Web App ของ Google Apps Script มาใส่ตรงนี้ **
        const GAS_URL = "https://script.google.com/macros/s/AKfycbxmiiNvyZlvNDSx0NW5mHy0XJHne6288C6hYFk1npn9Mpax0UwUGVZ4K3F30JLR9dicdA/exec"; 
        
        const LIFF_ID = "2010231682-1cf9vjea"; 
        const TARGET_LAT = 15.8141829; // ละติจูดอาคาร
        const TARGET_LON = 102.0134325; // ลองจิจูดอาคาร
        const MAX_DISTANCE = 500; 

        // 2. อ่านค่าจาก URL ของ LIFF (แยกเข้าเรียน/กลับบ้าน)
        const urlParams = new URLSearchParams(window.location.search);
        const actionType = urlParams.get('action') === 'out' ? 'กลับบ้าน' : 'เข้าเรียน';

        window.onload = function() {
            // ปรับหัวข้อตาม action
            document.getElementById('page-title').innerHTML = `ระบบเช็คชื่อ <span>${actionType}</span>`;
            initializeLiff();
        };

        function initializeLiff() {
            liff.init({ liffId: LIFF_ID }).then(() => {
                if (!liff.isLoggedIn()) {
                    liff.login({ redirectUri: window.location.href });
                } else {
                    document.getElementById('status-text').innerText = "ค้นหาตำแหน่ง GPS...";
                    getLocation();
                }
            }).catch(err => {
                showError("Error LIFF: " + err);
            });
        }

        function getLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        let userLat = position.coords.latitude;
                        let userLon = position.coords.longitude;
                        let distance = calculateDistance(userLat, userLon, TARGET_LAT, TARGET_LON);
                        
                        if (distance <= MAX_DISTANCE) {
                            document.getElementById('status-text').innerText = "กำลังบันทึกข้อมูล...";
                            saveDataAndSendFlex(userLat, userLon);
                        } else {
                            showError(`คุณไม่ได้อยู่ที่อาคารเรียน\n(ห่าง ${distance.toFixed(0)} เมตร)`);
                        }
                    },
                    (error) => {
                        showError("กรุณาเปิด GPS และอนุญาตการเข้าถึง");
                    },
                    { enableHighAccuracy: true }
                );
            } else {
                showError("มือถือไม่รองรับ GPS");
            }
        }

        function saveDataAndSendFlex(lat, lon) {
            liff.getProfile().then(profile => {
                // แพ็กข้อมูลเตรียมส่งไปหา Google Apps Script
                const payload = {
                    type: 'liff_submit',
                    userId: profile.userId,
                    displayName: profile.displayName,
                    action: actionType,
                    lat: lat,
                    lon: lon
                };

                // ส่งข้อมูลด้วย fetch แทน google.script.run
                fetch(GAS_URL, {
                    method: 'POST',
                    body: JSON.stringify(payload) // ส่งแบบ text/plain ป้องกัน CORS Error
                })
                .then(response => response.json())
                .then(result => {
                    if (result.status === 'success') {
                        document.getElementById('status-text').innerText = "บันทึกสำเร็จ!";
                        document.getElementById('sub-status').innerText = "กำลังสร้างสลิปยืนยัน...";
                        sendFlexMessage(profile.displayName, result.date, result.time, actionType);
                    } else {
                        showError("บันทึกไม่สำเร็จ: " + result.message);
                    }
                })
                .catch(err => {
                    showError("ไม่สามารถเชื่อมต่อฐานข้อมูลได้: " + err);
                });
            });
        }

        function sendFlexMessage(name, date, time, actionStr) {
            const flexMsg = {
                "type": "flex",
                "altText": `นักเรียนลงเวลา${actionStr}สำเร็จ`,
                "contents": {
                  "type": "bubble",
                  "size": "kilo",
                  "body": {
                    "type": "box",
                    "layout": "vertical",
                    "contents": [
                      {
                        "type": "text",
                        "text": "บันทึกเวลาเรียน",
                        "weight": "bold",
                        "size": "lg",
                        "color": "#f97316"
                      },
                      {
                        "type": "text",
                        "text": `วันที่ ${date}`,
                        "size": "xs",
                        "color": "#94a3b8",
                        "margin": "sm"
                      },
                      {
                        "type": "separator",
                        "margin": "md"
                      },
                      {
                        "type": "text",
                        "text": "แผนกวิชาอิเล็กทรอนิกส์",
                        "margin": "md",
                        "size": "sm",
                        "color": "#475569",
                        "weight": "bold"
                      },
                      {
                        "type": "text",
                        "text": `👨‍🎓 ${name}`,
                        "weight": "bold",
                        "size": "md",
                        "color": "#1e293b",
                        "margin": "md"
                      },
                      {
                        "type": "box",
                        "layout": "horizontal",
                        "margin": "md",
                        "contents": [
                          {
                            "type": "text",
                            "text": `สถานะ: ${actionStr}`,
                            "size": "sm",
                            "color": "#64748b"
                          },
                          {
                            "type": "text",
                            "text": time,
                            "size": "sm",
                            "color": "#16a34a",
                            "align": "end",
                            "weight": "bold"
                          }
                        ]
                      }
                    ]
                  }
                }
            };

            liff.sendMessages([flexMsg]).then(() => {
                liff.closeWindow(); 
            }).catch(err => {
                showError("ส่งข้อความไม่ได้: " + err);
            });
        }

        function calculateDistance(lat1, lon1, lat2, lon2) {
            var R = 6371e3; 
            var f1 = lat1 * Math.PI/180;
            var f2 = lat2 * Math.PI/180;
            var df = (lat2-lat1) * Math.PI/180;
            var dl = (lon2-lon1) * Math.PI/180;

            var a = Math.sin(df/2) * Math.sin(df/2) + Math.cos(f1) * Math.cos(f2) * Math.sin(dl/2) * Math.sin(dl/2);
            var c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c; 
        }

        function showError(msg) {
            document.getElementById('status-text').innerText = msg;
            document.getElementById('status-text').style.color = '#dc2626';
            document.querySelector('.spinner').style.display = 'none';
            document.getElementById('sub-status').style.display = 'none';
        }
    </script>
</body>
</html>
