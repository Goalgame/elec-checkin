<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>บันทึกเวลา แผนกอิเล็กทรอนิกส์</title>
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        body {
            font-family: 'Sarabun', sans-serif;
            background-color: #f0f4f8;
            background-image: radial-gradient(#cbd5e1 1px, transparent 1px);
            background-size: 20px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 30px 0;
        }
        .header { text-align: center; margin-bottom: 10px; }
        .header h2 { color: #1e293b; display: inline; font-size: 24px; }
        .header h2 span { color: #f97316; } 
        .icon { font-size: 50px; margin: 5px 0; text-align: center; }
        .dept-name { color: #0f172a; font-size: 18px; font-weight: bold; margin-bottom: 2px; text-align: center;}
        .sub-name { color: #64748b; font-size: 12px; margin-bottom: 20px; text-align: center; }
        
        .box-container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
            width: 85%;
            max-width: 320px;
        }
        /* Loading Box */
        .loading-box { text-align: center; }
        .spinner {
            border: 5px solid #f1f5f9;
            border-top: 5px solid #f97316;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        #status-text { font-size: 16px; color: #334155; font-weight: bold; }
        #sub-status { font-size: 12px; color: #94a3b8; margin-top: 8px;}
        
        /* Register Box */
        .register-box { display: none; }
        .register-title { color: #1e293b; font-size: 16px; font-weight: bold; margin-bottom: 15px; text-align: center; border-bottom: 2px solid #e2e8f0; padding-bottom: 10px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 13px; color: #475569; margin-bottom: 5px; font-weight: bold; }
        .form-control {
            width: 100%; box-sizing: border-box; padding: 10px;
            border: 1px solid #cbd5e1; border-radius: 6px;
            font-family: 'Sarabun', sans-serif; font-size: 14px;
        }
        .form-control:focus { outline: none; border-color: #f97316; }
        .btn-submit {
            background-color: #f97316; color: white; width: 100%;
            border: none; padding: 12px; border-radius: 6px;
            font-size: 16px; font-weight: bold; font-family: 'Sarabun', sans-serif;
            cursor: pointer; margin-top: 10px;
        }
        .btn-submit:active { background-color: #ea580c; }
    </style>
</head>
<body>

    <div class="header">
        <h2 id="page-title">ระบบเช็คชื่อ <span>...</span></h2>
    </div>
    <div class="icon">🔌</div>
    <div class="dept-name">แผนกวิชาอิเล็กทรอนิกส์</div>
    <div class="sub-name">Electronics Department</div>

    <div id="loading-view" class="box-container loading-box">
        <div class="spinner"></div>
        <div id="status-text">กำลังตรวจสอบข้อมูลผู้ใช้...</div>
        <div id="sub-status">กรุณารอสักครู่</div>
    </div>

    <div id="register-view" class="box-container register-box">
        <div class="register-title">📝 ลงทะเบียนใช้งานครั้งแรก</div>
        
        <div class="form-group">
            <label>รหัสนักศึกษา</label>
            <input type="number" id="reg-sid" class="form-control" placeholder="เช่น 6620101001">
        </div>
        <div class="form-group">
            <label>ชื่อ - นามสกุล</label>
            <input type="text" id="reg-name" class="form-control" placeholder="เช่น นายเรียนดี ขยันยิ่ง">
        </div>
        <div class="form-group">
            <label>กลุ่มเรียน</label>
            <input type="text" id="reg-group" class="form-control" placeholder="เช่น A1, B1, D1">
        </div>
        
        <button class="btn-submit" onclick="submitRegistration()">บันทึกข้อมูล</button>
    </div>

    <script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycbwUFHK2sRZ6ckOC1V5_NhdGLwuEhSnffQdLFV33LhGn8H0_wG_yz9bknNXPe4vMnYnwUQ/exec"; 
        const LIFF_ID = "2010231682-1cf9vjea"; 
        const TARGET_LAT = 15.812257; 
        const TARGET_LON = 102.015824; 
        const MAX_DISTANCE = 200; 

        const urlParams = new URLSearchParams(window.location.search);
        const actionType = urlParams.get('action') === 'out' ? 'กลับบ้าน' : 'เข้าเรียน';
        
        let currentUserProfile = null; 

        window.onload = function() {
            document.getElementById('page-title').innerHTML = `ระบบเช็คชื่อ <span>${actionType}</span>`;
            initializeLiff();
        };

        function initializeLiff() {
            liff.init({ liffId: LIFF_ID }).then(() => {
                if (!liff.isLoggedIn()) {
                    liff.login({ redirectUri: window.location.href });
                } else {
                    liff.getProfile().then(profile => {
                        currentUserProfile = profile;
                        checkUserRegistration(profile.userId); 
                    });
                }
            }).catch(err => {
                showError("Error LIFF: " + err);
            });
        }

        function checkUserRegistration(userId) {
            fetch(GAS_URL, {
                method: 'POST',
                body: JSON.stringify({ type: 'check_user', userId: userId })
            })
            .then(res => res.json())
            .then(result => {
                if(result.registered) {
                    document.getElementById('status-text').innerText = "ค้นหาตำแหน่ง GPS...";
                    getLocation();
                } else {
                    document.getElementById('loading-view').style.display = 'none';
                    document.getElementById('register-view').style.display = 'block';
                }
            }).catch(err => showError("เชื่อมต่อฐานข้อมูลล้มเหลว"));
        }

        function submitRegistration() {
            const sid = document.getElementById('reg-sid').value.trim();
            const name = document.getElementById('reg-name').value.trim();
            const group = document.getElementById('reg-group').value.trim();

            if(!sid || !name || !group) {
                alert("กรุณากรอกข้อมูลให้ครบทุกช่องครับ");
                return;
            }

            document.getElementById('register-view').style.display = 'none';
            document.getElementById('loading-view').style.display = 'block';
            document.getElementById('status-text').innerText = "กำลังบันทึกประวัติ...";

            fetch(GAS_URL, {
                method: 'POST',
                body: JSON.stringify({ 
                    type: 'register_user', 
                    userId: currentUserProfile.userId,
                    studentId: sid,
                    name: name,
                    group: group
                })
            })
            .then(res => res.json())
            .then(result => {
                if(result.status === 'success') {
                    document.getElementById('status-text').innerText = "ลงทะเบียนสำเร็จ! ค้นหาตำแหน่ง...";
                    getLocation();
                } else {
                    showError("ลงทะเบียนล้มเหลว: " + result.message);
                }
            });
        }

        function getLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        let userLat = position.coords.latitude;
                        let userLon = position.coords.longitude;
                        let distance = calculateDistance(userLat, userLon, TARGET_LAT, TARGET_LON);
                        
                        if (distance <= MAX_DISTANCE) {
                            document.getElementById('status-text').innerText = "กำลังบันทึกการเข้าเรียน...";
                            saveCheckIn(userLat, userLon);
                        } else {
                            showError(`คุณไม่ได้อยู่ที่อาคารเรียน\n(ห่าง ${distance.toFixed(0)} เมตร)`);
                        }
                    },
                    (error) => showError("กรุณาเปิด GPS และอนุญาตการเข้าถึง"),
                    { enableHighAccuracy: true }
                );
            } else {
                showError("มือถือไม่รองรับ GPS");
            }
        }

        function saveCheckIn(lat, lon) {
            fetch(GAS_URL, {
                method: 'POST',
                body: JSON.stringify({
                    type: 'liff_submit',
                    userId: currentUserProfile.userId,
                    displayName: currentUserProfile.displayName,
                    action: actionType,
                    lat: lat,
                    lon: lon
                })
            })
            .then(res => res.json())
            .then(result => {
                if (result.status === 'success') {
                    document.getElementById('status-text').innerText = "บันทึกสำเร็จ!";
                    document.getElementById('sub-status').innerText = "กำลังส่งสลิปยืนยัน...";
                    // ตรวจสอบว่ามีตัวแปร group ส่งมาไหม ถ้าไม่มีให้เป็น -
                    const stdGroup = result.group || "-"; 
                    sendFlexMessage(result.realName, result.stdId, stdGroup, result.date, result.time, actionType);
                } else {
                    showError("บันทึกไม่สำเร็จ: " + result.message);
                }
            })
            .catch(err => showError("ไม่สามารถเชื่อมต่อฐานข้อมูลได้: " + err));
        }

        // ==========================================
        // ปรับแก้หน้าตา Flex Message (สลิป) ใหม่
        // ==========================================
        function sendFlexMessage(realName, studentId, stdGroup, date, time, actionStr) {
            // เลือกสีแถบคาดด้านบน (เข้า=ส้ม, กลับ=น้ำเงิน)
            const headerColor = actionStr === 'เข้าเรียน' ? "#f97316" : "#3b82f6";
            const iconUrl = actionStr === 'เข้าเรียน' ? "https://cdn-icons-png.flaticon.com/512/815/815454.png" : "https://cdn-icons-png.flaticon.com/512/3580/3580168.png";

            const flexMsg = {
                "type": "flex",
                "altText": `ระบบเช็คชื่อ: คุณลงเวลา${actionStr}สำเร็จ`,
                "contents": {
                  "type": "bubble",
                  "size": "mega",
                  "header": {
                    "type": "box",
                    "layout": "vertical",
                    "contents": [
                      {
                        "type": "box",
                        "layout": "horizontal",
                        "contents": [
                          {
                            "type": "image",
                            "url": iconUrl,
                            "size": "sm",
                            "flex": 1
                          },
                          {
                            "type": "text",
                            "text": `ทำรายการ${actionStr}`,
                            "weight": "bold",
                            "color": "#ffffff",
                            "size": "xl",
                            "flex": 4,
                            "gravity": "center",
                            "align": "center"
                          }
                        ]
                      }
                    ],
                    "backgroundColor": headerColor,
                    "paddingTop": "19px",
                    "paddingAll": "12px",
                    "paddingBottom": "16px"
                  },
                  "body": {
                    "type": "box",
                    "layout": "vertical",
                    "contents": [
                      {
                        "type": "text",
                        "text": "E-Slip การลงเวลาปฏิบัติงาน",
                        "weight": "bold",
                        "size": "md",
                        "color": "#1e293b",
                        "align": "center"
                      },
                      {
                        "type": "text",
                        "text": "แผนกวิชาอิเล็กทรอนิกส์",
                        "size": "xs",
                        "color": "#64748b",
                        "align": "center",
                        "margin": "sm"
                      },
                      {
                        "type": "separator",
                        "margin": "lg",
                        "color": "#e2e8f0",
                        "style": "dashed"
                      },
                      {
                        "type": "box",
                        "layout": "vertical",
                        "margin": "lg",
                        "spacing": "sm",
                        "contents": [
                          {
                            "type": "box",
                            "layout": "horizontal",
                            "contents": [
                              {
                                "type": "text",
                                "text": "รหัสนักศึกษา",
                                "size": "sm",
                                "color": "#64748b"
                              },
                              {
                                "type": "text",
                                "text": studentId,
                                "size": "sm",
                                "color": "#1e293b",
                                "align": "end",
                                "weight": "bold"
                              }
                            ]
                          },
                          {
                            "type": "box",
                            "layout": "horizontal",
                            "contents": [
                              {
                                "type": "text",
                                "text": "ชื่อ-สกุล",
                                "size": "sm",
                                "color": "#64748b"
                              },
                              {
                                "type": "text",
                                "text": realName,
                                "size": "sm",
                                "color": "#1e293b",
                                "align": "end",
                                "weight": "bold",
                                "wrap": true
                              }
                            ]
                          },
                          {
                            "type": "box",
                            "layout": "horizontal",
                            "contents": [
                              {
                                "type": "text",
                                "text": "กลุ่มเรียน",
                                "size": "sm",
                                "color": "#64748b"
                              },
                              {
                                "type": "text",
                                "text": stdGroup || "-",
                                "size": "sm",
                                "color": "#1e293b",
                                "align": "end",
                                "weight": "bold"
                              }
                            ]
                          }
                        ]
                      },
                      {
                        "type": "separator",
                        "margin": "lg",
                        "color": "#e2e8f0",
                        "style": "dashed"
                      },
                      {
                        "type": "box",
                        "layout": "horizontal",
                        "margin": "lg",
                        "contents": [
                          {
                            "type": "text",
                            "text": "วันที่",
                            "size": "sm",
                            "color": "#64748b"
                          },
                          {
                            "type": "text",
                            "text": date,
                            "size": "sm",
                            "color": "#1e293b",
                            "align": "end"
                          }
                        ]
                      },
                      {
                        "type": "box",
                        "layout": "horizontal",
                        "margin": "md",
                        "contents": [
                          {
                            "type": "text",
                            "text": "เวลาลงบันทึก",
                            "size": "sm",
                            "color": "#64748b"
                          },
                          {
                            "type": "text",
                            "text": time,
                            "size": "xl",
                            "color": "#16a34a",
                            "align": "end",
                            "weight": "bold"
                          }
                        ]
                      }
                    ]
                  },
                  "styles": {
                    "footer": {
                      "separator": true
                    }
                  }
                }
            };

            liff.sendMessages([flexMsg]).then(() => {
                liff.closeWindow(); 
            }).catch(err => showError("ส่งข้อความไม่ได้: " + err));
        }

        function calculateDistance(lat1, lon1, lat2, lon2) {
            var R = 6371e3; 
            var f1 = lat1 * Math.PI/180;
            var f2 = lat2 * Math.PI/180;
            var df = (lat2-lat1) * Math.PI/180;
            var dl = (lon2-lon1) * Math.PI/180;
            var a = Math.sin(df/2) * Math.sin(df/2) + Math.cos(f1) * Math.cos(f2) * Math.sin(dl/2) * Math.sin(dl/2);
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)); 
        }

        function showError(msg) {
            document.getElementById('status-text').innerText = msg;
            document.getElementById('status-text').style.color = '#dc2626';
            document.querySelector('.spinner').style.display = 'none';
            document.getElementById('sub-status').style.display = 'none';
        }
    </script>
</body>
</html>
